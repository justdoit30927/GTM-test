<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JZPEKR1EN8"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-JZPEKR1EN8');
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById('submitButton').onclick = function() {
        var inputValue = document.getElementById('inputField').value;
        gtag('event', 'submit_button_click', {
            'event_category': 'interaction',
            'event_label': inputValue
        });
    };
    });
    
    </script>
</head>
<body>
    <input type="text" id="inputField" placeholder="Enter text here">
    <input type="button" id="submitButton" value="Submit">
    <br/>
    <a href="https://www.google.com" id="googleLink">Go to Google</a>
</body>
</html>
